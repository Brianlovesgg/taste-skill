# Deploys the MKT Terminal (terminal/) to GitHub Pages.
# Based on GitHub's official static Pages starter workflow.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy terminal to Pages

on:
  push:
    branches: [main]
    paths: ['terminal/**', '.github/workflows/terminal-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: terminal
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
